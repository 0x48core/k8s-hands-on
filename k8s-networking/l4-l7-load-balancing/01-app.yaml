apiVersion: v1
kind: Namespace
metadata:
  name: lb-lab
---
# v1: 3 replicas. whoami echoes the pod hostname, so every response shows which pod served it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lb-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
      version: v1
  template:
    metadata:
      labels:
        app: web
        version: v1
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port", "8080", "--name", "v1"]
          ports:
            - name: http
              containerPort: 8080
          # Only Ready pods are added to EndpointSlices -> only they get L4 or L7 traffic
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
---
# v2: the canary, used by the L7 weighted / header routes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v2
  namespace: lb-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
      version: v2
  template:
    metadata:
      labels:
        app: web
        version: v2
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port", "8080", "--name", "v2"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
---
# Plain ClusterIP backends for the Gateway (L7). Traefik reads their EndpointSlices
# and balances per request across the pod IPs directly.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lb-lab
spec:
  selector:
    app: web
    version: v1
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: web-v2
  namespace: lb-lab
spec:
  selector:
    app: web
    version: v2
  ports:
    - name: http
      port: 80
      targetPort: http
---
# In-cluster client to run the curl experiments from
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: lb-lab
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sleep", "infinity"]
