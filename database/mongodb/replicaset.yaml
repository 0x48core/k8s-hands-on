# =============================================================================
# MongoDB Replica Set (3 members) on Kubernetes - plain StatefulSet
# Includes: keyfile auth, WiredTiger compression (zstd), per-pod PVC
#
# Create the secrets before applying:
#   openssl rand -base64 756 > keyfile
#   kubectl -n mongodb create secret generic mongo-keyfile --from-file=keyfile
#   kubectl -n mongodb create secret generic mongo-root \
#       --from-literal=username=admin --from-literal=password='<strong-password>'
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: mongodb

---
# -----------------------------------------------------------------------------
# mongod.conf - where compression and storage tuning live
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongod-config
  namespace: mongodb
data:
  mongod.conf: |
    storage:
      dbPath: /data/db
      wiredTiger:
        engineConfig:
          # IMPORTANT: set to ~50% of (memory limit - 1Gi).
          #   limit 4Gi -> 1.5
          #   limit 8Gi -> 3.5
          # If left unset, WiredTiger may size the cache from the NODE's RAM
          # instead of the container limit, which leads to OOMKill.
          cacheSizeGB: 1.5
          journalCompressor: snappy
        collectionConfig:
          # snappy (default) | zlib | zstd | none
          # zstd: better ratio than zlib at moderate CPU cost - good fit for
          # logs, text-heavy documents and cold historical data.
          blockCompressor: zstd
        indexConfig:
          prefixCompression: true

    net:
      port: 27017
      bindIpAll: true
      # Keep this bounded; each incoming connection costs roughly 1MB of stack.
      maxIncomingConnections: 2000

    replication:
      replSetName: rs0

    security:
      authorization: enabled
      keyFile: /etc/mongo-keyfile/keyfile

    operationProfiling:
      mode: slowOp
      slowOpThresholdMs: 200

    # setParameter:
    #   # zstd compression level, 1-22, defaults to 6.
    #   # Higher = smaller on disk, more CPU per write.
    #   wiredTigerZstdCompressionLevel: 6

---
# -----------------------------------------------------------------------------
# Headless service - gives each pod a stable DNS name:
#   mongodb-0.mongodb-headless.mongodb.svc.cluster.local
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: mongodb
  labels:
    app: mongodb
spec:
  clusterIP: None
  # Required so rs.initiate() can resolve peers before they report ready.
  publishNotReadyAddresses: true
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017

---
# Regular service for in-cluster applications to connect through.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: mongodb
spec:
  serviceName: mongodb-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 999        # the "mongodb" user in the official image
        runAsGroup: 999
        fsGroup: 999
      affinity:
        # Spread the three members across three different nodes.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: mongodb
              topologyKey: kubernetes.io/hostname

      initContainers:
        # mongod refuses to start unless the keyfile is mode 0400/0600 and owned
        # by the running user. A secret volume cannot express that, so copy the
        # file into an emptyDir and fix ownership and permissions there.
        - name: fix-keyfile-perms
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /secret/keyfile /keyfile-out/keyfile
              chmod 400 /keyfile-out/keyfile
              chown 999:999 /keyfile-out/keyfile
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: keyfile-secret
              mountPath: /secret
              readOnly: true
            - name: keyfile
              mountPath: /keyfile-out

      containers:
        - name: mongod
          image: mongo:7.0
          args:
            - --config=/etc/mongo/mongod.conf
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            # Only takes effect on the very first startup, while dbPath is empty.
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-root
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-root
                  key: password
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
            limits:
              cpu: "2"
              # Must stay consistent with cacheSizeGB above.
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: config
              mountPath: /etc/mongo
              readOnly: true
            - name: keyfile
              mountPath: /etc/mongo-keyfile
              readOnly: true
          # ping does not require authentication, so it works with auth enabled.
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6

      volumes:
        - name: config
          configMap:
            name: mongod-config
        - name: keyfile-secret
          secret:
            secretName: mongo-keyfile
        - name: keyfile
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Point this at an SSD/NVMe class. MongoDB is very sensitive to IOPS.
        storageClassName: standard
        resources:
          requests:
            storage: 50Gi

---
# Keep a majority available during voluntary disruptions (drains, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongodb
  namespace: mongodb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mongodb