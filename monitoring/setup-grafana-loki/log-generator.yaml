# Demo app that writes a JSON log line every 2 seconds
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i+1))
                if [ $((i % 5)) -eq 0 ]; then level=error; else level=info; fi
                echo "{\"level\":\"$level\",\"msg\":\"request handled\",\"count\":$i,\"pod\":\"$HOSTNAME\"}"
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
